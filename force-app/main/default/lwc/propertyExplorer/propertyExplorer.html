<template>
    <div class="property-explorer">

        <div class="slds-page-header slds-m-bottom_medium">
            <div class="slds-grid slds-wrap slds-grid_align-spread slds-grid_vertical-align-center">
                <div class="slds-col">
                    <h1 class="slds-text-heading_large">Property Explorer</h1>
                    <p class="slds-text-body_regular slds-m-top_x-small">
                        Browse, filter, and manage properties.
                    </p>
                </div>
                <div class="slds-col slds-m-top_small">
                    <lightning-button
                        label="Add Property"
                        title="Add a new property"
                        variant="brand"
                        icon-name="utility:add"
                        onclick={handleNewProperty}
                        disabled={isSaving}>
                    </lightning-button>
                </div>
            </div>
        </div>

        <lightning-card title="Search Properties" icon-name="utility:filterList">
            <div class="slds-p-around_medium">
                <div class="slds-grid slds-wrap slds-gutters">

                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                        <lightning-combobox
                            name="propertyType"
                            label="Property Type"
                            value={propertyType}
                            options={propertyTypeOptions}
                            placeholder="All property types"
                            onchange={handleFilterChange}>
                        </lightning-combobox>
                    </div>

                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                        <lightning-combobox
                            name="status"
                            label="Availability"
                            value={status}
                            options={availabilityOptions}
                            placeholder="All availability"
                            onchange={handleFilterChange}>
                        </lightning-combobox>
                    </div>

                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                        <lightning-combobox
                            name="furnishingStatus"
                            label="Furnishing"
                            value={furnishingStatus}
                            options={furnishingOptions}
                            placeholder="All furnishing types"
                            onchange={handleFilterChange}>
                        </lightning-combobox>
                    </div>

                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-top_small">
                        <lightning-input
                            type="number"
                            name="minRent"
                            label="Minimum Monthly Rent (₹)"
                            value={minRent}
                            min="0"
                            onchange={handleFilterChange}>
                        </lightning-input>
                    </div>

                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-top_small">
                        <lightning-input
                            type="number"
                            name="maxRent"
                            label="Maximum Monthly Rent (₹)"
                            value={maxRent}
                            min="0"
                            onchange={handleFilterChange}>
                        </lightning-input>
                    </div>
                </div>

                <div class="slds-box slds-m-top_medium">
                    <h3 class="slds-text-heading_small slds-m-bottom_small">
                        Nearby Property Search
                    </h3>

                    <lightning-input
                        type="checkbox"
                        label="Enable nearby search"
                        checked={nearbyEnabled}
                        onchange={handleNearbyToggle}>
                    </lightning-input>

                    <div class="slds-grid slds-wrap slds-gutters slds-m-top_small">
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-input
                                type="number"
                                name="distanceKm"
                                label="Search Radius (km)"
                                value={distanceKm}
                                min="0.1"
                                max="500"
                                step="0.1"
                                onchange={handleFilterChange}>
                            </lightning-input>
                        </div>

                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-top_large">
                            <lightning-button
                                label="Use My Location"
                                icon-name="utility:location"
                                onclick={handleUseMyLocation}
                                disabled={isGettingLocation}>
                            </lightning-button>
                        </div>
                    </div>

                    <p class="slds-text-body_small slds-m-top_small">
                        Allow browser location access to search properties
                        within your selected radius.
                    </p>
                </div>

                <div class="slds-m-top_medium">
                    <lightning-button
                        label="Apply Filters"
                        variant="brand"
                        onclick={handleApplyFilters}
                        disabled={isLoading}>
                    </lightning-button>

                    <lightning-button
                        label="Reset"
                        variant="neutral"
                        class="slds-m-left_small"
                        onclick={handleResetFilters}
                        disabled={isLoading}>
                    </lightning-button>
                </div>
            </div>
        </lightning-card>

        <div class="slds-grid slds-wrap slds-grid_align-spread slds-grid_vertical-align-center slds-m-top_large slds-m-bottom_small">
            <div>
                <h2 class="slds-text-heading_medium">Properties</h2>
                <p class="slds-text-body_small slds-m-top_x-small">
                    Total matching properties: {totalRecords}
                </p>
            </div>
        </div>

        <template lwc:if={isLoading}>
            <div class="slds-is-relative slds-p-around_xx-large">
                <lightning-spinner
                    alternative-text="Loading properties"
                    size="medium">
                </lightning-spinner>
            </div>
        </template>

        <template lwc:if={errorMessage}>
            <div class="slds-notify slds-notify_alert slds-alert_error slds-m-vertical_medium"
                 role="alert">
                <lightning-icon
                    icon-name="utility:error"
                    alternative-text="Error"
                    variant="inverse"
                    size="x-small"
                    class="slds-m-right_small">
                </lightning-icon>
                <span>{errorMessage}</span>
            </div>
        </template>

        <template lwc:if={hasProperties}>
            <div class="property-grid">
                <template for:each={propertyCards} for:item="propertyRecord">
                    <article key={propertyRecord.Id} class="property-card">

                        <div class="property-image-container">
                            <template lwc:if={propertyRecord.showImage}>
                                <img
                                    src={propertyRecord.imageUrl}
                                    alt={propertyRecord.Name}
                                    data-property-id={propertyRecord.Id}
                                    onerror={handleImageError}
                                    class="property-image">
                            </template>

                            <template lwc:if={propertyRecord.showFallback}>
                                <div class="image-fallback">
                                    <lightning-icon
                                        icon-name="utility:photo"
                                        size="large"
                                        alternative-text="No property image">
                                    </lightning-icon>
                                    <span>No image available</span>
                                </div>
                            </template>

                            <span class={propertyRecord.statusClass}>
                                {propertyRecord.Status__c}
                            </span>
                        </div>

                        <div class="property-details">
                            <h3 class="property-name">{propertyRecord.Name}</h3>

                            <div class="property-location">
                                <lightning-icon
                                    icon-name="utility:location"
                                    size="xx-small"
                                    alternative-text="Location">
                                </lightning-icon>
                                <span>{propertyRecord.location}</span>
                            </div>

                            <template lwc:if={propertyRecord.showDistance}>
                                <p class="slds-text-color_success slds-m-top_x-small">
                                    {propertyRecord.distanceLabel}
                                </p>
                            </template>

                            <p class="property-type">
                                {propertyRecord.Property_Type__c}
                                <template lwc:if={propertyRecord.Furnishing_Status__c}>
                                    <span> · </span>
                                    {propertyRecord.Furnishing_Status__c}
                                </template>
                            </p>

                            <template lwc:if={propertyRecord.Description__c}>
                                <p class="property-description">
                                    {propertyRecord.Description__c}
                                </p>
                            </template>

                            <div class="property-card-footer">
                                <p class="rent-label">Monthly Rent</p>
                                <p class="property-rent">
                                    {propertyRecord.formattedRent}
                                </p>
                            </div>

                            <div class="slds-m-top_small">
                                <lightning-button
                                    label="View Property Record"
                                    variant="neutral"
                                    data-property-id={propertyRecord.Id}
                                    onclick={handleViewProperty}
                                    class="view-property-button">
                                </lightning-button>
                            </div>
                        </div>
                    </article>
                </template>
            </div>
        </template>

        <template lwc:if={noPropertiesFound}>
            <div class="empty-state">
                <lightning-icon
                    icon-name="utility:home"
                    size="large"
                    alternative-text="No properties">
                </lightning-icon>

                <h3 class="slds-text-heading_medium slds-m-top_medium">
                    No properties found
                </h3>

                <p class="slds-m-top_x-small">
                    Try changing your filters or create a new property.
                </p>

                <lightning-button
                    label="Add Property"
                    variant="brand"
                    class="slds-m-top_medium"
                    onclick={handleNewProperty}
                    disabled={isSaving}>
                </lightning-button>
            </div>
        </template>

        <template lwc:if={hasProperties}>
            <div class="pagination-container">
                <lightning-button
                    label="Previous"
                    icon-name="utility:chevronleft"
                    onclick={handlePrevious}
                    disabled={previousDisabled}>
                </lightning-button>

                <span class="pagination-label">
                    Page {pageNumber} of {totalPages}
                </span>

                <lightning-button
                    label="Next"
                    icon-name="utility:chevronright"
                    icon-position="right"
                    onclick={handleNext}
                    disabled={nextDisabled}>
                </lightning-button>
            </div>
        </template>

        <template lwc:if={showNewPropertyModal}>
            <section
                role="dialog"
                tabindex="-1"
                aria-modal="true"
                aria-labelledby="new-property-heading"
                class="slds-modal slds-fade-in-open">

                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <lightning-button-icon
                            icon-name="utility:close"
                            alternative-text="Close"
                            title="Close"
                            variant="bare-inverse"
                            class="slds-modal__close"
                            onclick={handleCloseModal}
                            disabled={isSaving}>
                        </lightning-button-icon>

                        <h2 id="new-property-heading"
                            class="slds-text-heading_medium">
                            Add New Property
                        </h2>

                        <p class="slds-m-top_x-small">
                            Complete the property details and upload at least
                            one image before saving.
                        </p>
                    </header>

                    <div class="slds-modal__content slds-p-around_medium">
                        <template lwc:if={errorMessage}>
                            <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_medium"
                                 role="alert">
                                {errorMessage}
                            </div>
                        </template>

                        <h3 class="slds-text-heading_small slds-m-bottom_small">
                            Property Details
                        </h3>

                        <lightning-input
                            class="property-input"
                            name="Name"
                            label="Property Name"
                            value={property.Name}
                            onchange={handleInputChange}
                            required>
                        </lightning-input>

                        <lightning-combobox
                            class="property-input slds-m-top_small"
                            name="Property_Type__c"
                            label="Property Type"
                            value={property.Property_Type__c}
                            options={propertyTypeOptions}
                            onchange={handleInputChange}
                            required>
                        </lightning-combobox>

                        <lightning-combobox
                            class="property-input slds-m-top_small"
                            name="Furnishing_Status__c"
                            label="Furnishing Status"
                            value={property.Furnishing_Status__c}
                            options={furnishingOptions}
                            onchange={handleInputChange}>
                        </lightning-combobox>

                        <lightning-combobox
                            class="property-input slds-m-top_small"
                            name="Status__c"
                            label="Availability"
                            value={property.Status__c}
                            options={availabilityOptions}
                            onchange={handleInputChange}
                            required>
                        </lightning-combobox>

                        <lightning-input
                            class="property-input slds-m-top_small"
                            type="number"
                            name="Rent__c"
                            label="Monthly Rent (₹)"
                            value={property.Rent__c}
                            min="0.01"
                            step="0.01"
                            onchange={handleInputChange}
                            required>
                        </lightning-input>

                        <h3 class="slds-text-heading_small slds-m-top_large slds-m-bottom_small">
                            Property Address
                        </h3>

                        <lightning-input
                            class="property-input"
                            name="Address__c"
                            label="Address"
                            value={property.Address__c}
                            onchange={handleInputChange}
                            required>
                        </lightning-input>

                        <lightning-input
                            class="property-input slds-m-top_small"
                            name="City__c"
                            label="City"
                            value={property.City__c}
                            onchange={handleInputChange}
                            required>
                        </lightning-input>

                        <lightning-input
                            class="property-input slds-m-top_small"
                            name="State__c"
                            label="State"
                            value={property.State__c}
                            onchange={handleInputChange}
                            required>
                        </lightning-input>

                        <lightning-input
                            class="property-input slds-m-top_small"
                            name="Postal_Code__c"
                            label="Postal Code"
                            value={property.Postal_Code__c}
                            onchange={handleInputChange}
                            required>
                        </lightning-input>

                        <lightning-input
                            class="property-input slds-m-top_small"
                            name="Country__c"
                            label="Country"
                            value={property.Country__c}
                            onchange={handleInputChange}
                            required>
                        </lightning-input>

                        <h3 class="slds-text-heading_small slds-m-top_large slds-m-bottom_small">
                            Description
                        </h3>

                        <lightning-textarea
                            class="property-input"
                            name="Description__c"
                            label="Property Description"
                            value={property.Description__c}
                            onchange={handleInputChange}
                            required>
                        </lightning-textarea>

                        <h3 class="slds-text-heading_small slds-m-top_large slds-m-bottom_small">
                            Property Images
                        </h3>

                        <p class="slds-text-body_small slds-m-bottom_small">
                            Upload one or more JPG, JPEG, PNG, GIF, or WEBP images.
                            At least one image is required.
                        </p>

                        <lightning-file-upload
                            label="Upload Property Images"
                            name="propertyImageUploader"
                            record-id={stagingId}
                            accept={acceptedFormats}
                            multiple
                            onuploadfinished={handleUploadFinished}
                            disabled={isSaving}>
                        </lightning-file-upload>

                        <template lwc:if={hasUploadedImages}>
                            <div class="slds-m-top_small slds-text-color_success">
                                {uploadedFileNames.length} image file(s) uploaded.
                            </div>
                        </template>
                    </div>

                    <footer class="slds-modal__footer">
                        <lightning-button
                            label="Cancel"
                            variant="neutral"
                            onclick={handleCloseModal}
                            disabled={isSaving}>
                        </lightning-button>

                        <lightning-button
                            label="Save Property"
                            variant="brand"
                            class="slds-m-left_small"
                            onclick={handleSaveProperty}
                            disabled={saveDisabled}>
                        </lightning-button>
                    </footer>
                </div>
            </section>

            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </div>
</template>
